services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "8765:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - DB_CONNECTION=sqlite
      - APP_KEY=${APP_KEY}
      - SPEEDTEST_SCHEDULE=*/30 * * * *
    volumes:
      - ./speedtest-tracker/config:/config
